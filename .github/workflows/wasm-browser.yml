name: Browser WASM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  minimal-toolchain:
    name: No native compiler
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/ci/compiler-free-linker.sh
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Install transport tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git libc6-dev libgcc-12-dev lld nodejs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.85 and wasm32
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            --output /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" |
            sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.85.0
          "$HOME/.cargo/bin/rustup" target add --toolchain 1.85.0 wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify minimal toolchain
        run: |
          test -z "${RUSTFLAGS:-}"
          for tool in cc gcc clang c++ g++ cmake; do
            if command -v "$tool"; then
              echo "unexpected native build tool: $tool" >&2
              exit 1
            fi
          done
          command -v ld.lld
          test -x "$CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER"
      - name: Check browser graph
        run: tests/wasm-consumer/check-wasm-graph.sh
      - name: Compile the real HTTP consumer
        run: |
          cargo generate-lockfile
          cargo check --locked --test http --target wasm32-unknown-unknown \
            --no-default-features --features http-base,reqwest,web

  browser-protocol:
    name: Chrome and Firefox protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: wasm-pack@0.13.1
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Exercise Fetch and browser retry
        run: |
          node ci/wasm-http-test-server.mjs > /tmp/wasm-http-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          cargo generate-lockfile --manifest-path tests/wasm-consumer/Cargo.toml
          wasm-pack test --headless --chrome --firefox tests/wasm-consumer --locked --test http \
            --no-default-features --features http-base,reqwest,web
